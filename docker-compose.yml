services:
  odoo:
    image: odoo:19.0
    container_name: odoo_hackathon
    ports:
      - "8069:8069"
    volumes:
      - odoo-data:/var/lib/odoo
      - odoo-addons:/mnt/extra-addons
    environment:
      - HOST=crm-postgres
      - USER=odoo
      - PASSWORD=odoo
      - DB_FILTER=odoo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - crm-network

networks:
  crm-network:
    external: true
    name: thecrmdigitalfte_crm-network

volumes:
  odoo-data:
  odoo-addons:
